  # postgres-exporter:
  #   image: prometheuscommunity/postgres-exporter:latest
  #   container_name: postgres-exporter
  #   environment:
  #     DATA_SOURCE_NAME: 'postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable'
  #   ports:
  #     - '9187:9187'
  #   restart: unless-stopped
  #   depends_on:
  #     - db
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 30M

  db:
    image: postgres:15-alpine
    platform: linux/arm64
    container_name: bumang_blog_db
    restart: always
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    deploy:
      resources:
        limits:
          memory: 100M
        reservations:
          memory: 50M

  app:
    image: bumang/bumang-blog-backend:latest
    container_name: bumang_blog_backend
    restart: unless-stopped
    expose:
      - '4001'
    depends_on:
      - db
    env_file:
      - .env.production
    environment:
      - NODE_ENV=production
    # 실행 옵션을 NODE_OPTIONS가 아니라 command에 둔다 — 배포 때 도는
    # `docker-compose run app npm run migration:run`(ts-node)은 command를 덮어쓰므로
    # 아래 힙 상한의 영향을 받지 않는다.
    #
    # --max-old-space-size: V8 힙 상한. 없으면 Node가 컨테이너 한도를 넘겨 쓰려다
    #   스왑에 빠져 죽지도 못하고 멈춘다. 한도보다 낮게 잡아 "힙 부족"으로 깔끔하게 죽고
    #   바로 재시작되게 한다(나머지는 버퍼·네이티브 메모리 몫).
    # --report-*: 치명적 오류로 죽을 때 진단 리포트(JSON, 수십 KB)를 남긴다. 호출 스택·힙
    #   상태가 들어 있어 코어 덤프 대신 쓴다. --report-exclude-env가 없으면 환경변수
    #   (DB 비밀번호·JWT 키)가 리포트에 그대로 담긴다.
    command:
      - node
      - --max-old-space-size=224
      - --report-on-fatalerror
      - --report-uncaught-exception
      - --report-exclude-env
      - --report-dir=/app/logs/reports
      - dist/src/main.js
    volumes:
      # 로그·진단 리포트를 컨테이너 밖에 둔다. 컨테이너 안에 두면 재배포 때 사라져서
      # "왜 죽었는지"를 뒤늦게 확인할 수 없다(2026-09 세 차례 비정상 종료의 원인을 못 찾음).
      # 크기는 winston 설정(maxsize·maxFiles)이 묶는다 — 합계 최대 약 350MB.
      - /var/log/bumang-blog/backend:/app/logs
    logging: *default-logging
    deploy:
      resources:
        # 2026-10 실측: 평소 약 75MB, 재시작 후 최고 101MB(geoip-lite 제거 후).
        # t4g.micro(약 920MB)로 내릴 것을 전제로 컨테이너 하나가 서버를 잡아먹지 못하게 잡는다.
        limits:
          memory: 320M
        reservations:
          memory: 80M

  frontend:
    image: bumang/bumang-blog-frontend:latest
    container_name: bumang_blog_frontend
    platform: linux/arm64
    restart: unless-stopped
    expose:
      - '4000'
    env_file:
      - ../bumang-blog-front/.env.production
    environment:
      - NODE_ENV=production
      # SSR이 백엔드를 부를 때 쓰는 내부 주소. 같은 compose 네트워크라 서비스명 `app`으로
      # 바로 닿는다. 공개 주소(api.bumang.xyz)로 부르면 인터넷 → Cloudflare → nginx를 한 바퀴
      # 돌아 옆 컨테이너로 들어오는 데다, 방문자 IP를 넘기려고 붙이는 cf-connecting-ip를
      # Cloudflare가 403으로 튕긴다(2026-09-06 글 상세 SSR 전면 장애). 브라우저는 여전히
      # NEXT_PUBLIC_API_BASE_URL(공개 주소)을 쓴다.
      - API_INTERNAL_URL=http://app:4001
    # 힙 상한·진단 리포트는 app 서비스의 주석 참고. 프론트는 sharp(이미지 처리)가 V8 힙
    # 바깥의 네이티브 메모리를 쓰므로 힙 상한을 더 낮게 잡아 여유를 남긴다.
    command:
      - node
      - --max-old-space-size=192
      - --report-on-fatalerror
      - --report-uncaught-exception
      - --report-exclude-env
      - --report-dir=/app/reports
      - server.js
    volumes:
      # 컨테이너가 uid 1001(nextjs)로 돌아서 호스트 디렉토리도 1001 소유여야 쓸 수 있다.
      - /var/log/bumang-blog/frontend:/app/reports
    depends_on:
      - app
    logging: *default-logging
    deploy:
      resources:
        limits:
          # Next.js SSR이 150M 한도에서 OOM 킬 나던 이력이 있다. 2026-10 실측: 평소 약 85MB,
          # 재시작 후 최고 123MB. 이미지 처리(sharp)의 순간 사용분을 남기고 t4g.micro에 맞춘다.
          memory: 320M
        reservations:
          memory: 75M

volumes:
  postgres_data:
