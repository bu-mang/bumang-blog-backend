version: '3.8'

# 컨테이너 stdout 로그가 무한 증식해 디스크를 채우는 것을 막는 공통 로테이션 정책.
# (2026-07 프론트 7.6G·nginx 1.6G 로그로 루트 디스크 100% 포화 → 502 장애가 있었음)
x-logging: &default-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  nginx:
    image: nginx:alpine
    container_name: bumang_blog_nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - app
      - frontend
    restart: unless-stopped
    logging: *default-logging

  certbot:
    image: certbot/certbot
    container_name: bumang_blog_certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    dns:
      - 8.8.8.8
      - 8.8.4.4
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    # 없으면 서버 재부팅 뒤 이 컨테이너만 다시 뜨지 않아 인증서 자동 갱신이 조용히 멈춘다.
    restart: unless-stopped
    logging: *default-logging

  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: prometheus
  #   volumes:
  #     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
