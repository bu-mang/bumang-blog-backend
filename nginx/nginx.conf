events {
    worker_connections 1024;
}

http {
    # ── 실제 방문자 IP 복원 (Cloudflare 뒤) ──────────────────────────────────────
    # 모든 요청은 Cloudflare를 거쳐 온다(EC2 보안 그룹이 80·443을 Cloudflare 대역만 허용).
    # 그래서 $remote_addr가 늘 Cloudflare IP였고, 접근 로그·X-Real-IP로는 방문자를 알 수 없었다
    # (2026-11-20 봇 폭주 때 서버 로그로 출처를 못 찾았다).
    # Cloudflare 대역에서 온 요청에 한해 CF-Connecting-IP 헤더를 실제 방문자 IP로 믿는다.
    #
    # ⚠️ 대역 목록은 하드코딩이다. Cloudflare가 대역을 바꾸면 여기를 갱신해야 한다.
    #    출처: https://www.cloudflare.com/ips-v4 · https://www.cloudflare.com/ips-v6 (마지막 확인 2026-11-21)
    #    EC2 보안 그룹의 80·443 허용 대역도 같은 IPv4 목록이다 — 바꿀 때 같이 바꾼다.
    #
    # 백엔드의 방문자 IP 판정(cf-throttler.guard.ts · request-meta.util.ts)은 CF-Connecting-IP
    # 헤더를 직접 읽으므로 이 설정과 무관하다. 바뀌는 건 접근 로그와 X-Real-IP·X-Forwarded-For 값뿐이다.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    upstream backend {
        server bumang_blog_backend:4001;
    }

    upstream frontend {
        server bumang_blog_frontend:4000;
    }

    # HTTP 서버 (Let's Encrypt 인증용 + HTTPS 리다이렉트)
    server {
        listen 80;
        server_name api.bumang.xyz bumang.xyz www.bumang.xyz;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS 서버 - 백엔드 (api.bumang.xyz)
    server {
        listen 443 ssl http2;
        server_name api.bumang.xyz;

        # SSL 인증서 설정
        ssl_certificate /etc/letsencrypt/live/api.bumang.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.bumang.xyz/privkey.pem;
        
        # SSL 보안 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # HSTS 보안 헤더
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Prometheus 메트릭은 외부 노출 차단 (내부망 app:4001로만 스크랩)
        location /metrics {
            deny all;
            return 403;
        }

        # 백엔드로 프록시
        location / {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # HTTPS 서버 - 프론트엔드 (bumang.xyz)
    server {
        listen 443 ssl http2;
        server_name bumang.xyz www.bumang.xyz;

        # SSL 인증서 설정
        ssl_certificate /etc/letsencrypt/live/bumang.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/bumang.xyz/privkey.pem;

        # SSL 보안 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers off;

        # HSTS 보안 헤더
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Gzip 압축
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript;

        # 클라이언트 최대 업로드 크기
        client_max_body_size 10M;

        # Next.js 프론트엔드로 프록시
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;

            # Timeout 설정
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}